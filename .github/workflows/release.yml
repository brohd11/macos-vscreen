name: release

# Shared macOS app release, rendered from sh-templates/mac-apps. The repo supplies:
#   scripts/package.sh VERSION BUILD OUT_DIR   writes OUT_DIR/<name>.zip and <name>.zip.sha256
#   scripts/test.sh                            optional; runs before packaging
#   .github/release-notes.md                   optional; appended to the generated notes
#   cliff.toml                                 rendered changelog policy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the manual build (MAJOR.MINOR.PATCH[-PRERELEASE])
        required: true
        default: "0.0.0"
        type: string
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine and validate version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # MAJOR.MINOR.PATCH with an optional -PRERELEASE suffix (e.g. 0.1.0-alpha.1).
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" != v* || ! "$version" =~ $semver ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH[-PRERELEASE] without leading zeroes." >&2
              exit 1
            fi
            release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
              echo "Release tag $GITHUB_REF_NAME does not point to a commit on main." >&2
              exit 1
            fi
          else
            version="$MANUAL_VERSION"
            if [[ ! "$version" =~ $semver ]]; then
              echo "Manual versions must use MAJOR.MINOR.PATCH[-PRERELEASE] without leading zeroes." >&2
              exit 1
            fi
          fi
          # package.sh stamps CFBundleShortVersionString, which must stay numeric.
          base_version="${version%%-*}"
          if [[ "$version" == "$base_version" ]]; then prerelease=false; else prerelease=true; fi
          {
            echo "version=$version"
            echo "base_version=$base_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Run tests
        run: |
          set -euo pipefail
          if [[ -x scripts/test.sh ]]; then
            scripts/test.sh
          else
            echo "no scripts/test.sh; skipping"
          fi

      - name: Build, sign, verify and archive
        env:
          VERSION: ${{ steps.version.outputs.base_version }}
        run: scripts/package.sh "$VERSION" "$GITHUB_RUN_NUMBER" dist

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          for sum in *.sha256; do shasum -a 256 -c "$sum"; done

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes need tags and full history.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          for sum in *.sha256; do sha256sum -c "$sum"; done

      # Prereleases cover changes since the previous tag. Full releases cover changes since the
      # previous full release, folding in any prereleases between (git-cliff's --current can't).
      - name: Select release notes range
        id: range
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            args="--current"
          else
            from="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$TAG^" 2>/dev/null \
              || git rev-list --max-parents=0 "$TAG" | tail -1)"
            args="--ignore-tags - $from..$TAG"
          fi
          echo "args=$args --strip header" >> "$GITHUB_OUTPUT"

      # Missing notes should not block a release; the next step falls back to a placeholder.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        continue-on-error: true
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.range.outputs.args }}
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Finalize release notes
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if [[ ! -s "$NOTES" ]]; then
            echo "::warning::git-cliff failed; publishing without generated notes"
            echo "Release notes could not be generated." > "$NOTES"
          fi
          if [[ -f .github/release-notes.md ]]; then
            printf '\n' >> "$NOTES"
            cat .github/release-notes.md >> "$NOTES"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
